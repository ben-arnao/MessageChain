<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MessageChain — entity profile</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111;
    --muted: #666;
    --card: #f5f5f5;
    --border: #ddd;
    --accent: #0a5;
    --pos: #0a5;
    --neg: #c33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --fg: #eee;
      --muted: #888;
      --card: #1a1a1d;
      --border: #2a2a2e;
      --accent: #6c9;
      --pos: #6c9;
      --neg: #e88;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
  }
  header {
    padding: 1.2rem 1.2rem 0.6rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
    letter-spacing: -0.01em;
  }
  header h1 a {
    color: var(--fg);
    text-decoration: none;
  }
  header .sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  header .sub a { color: var(--accent); }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1rem 4rem;
  }
  .id-row {
    margin: 0.4rem 0 1rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    color: var(--muted);
    word-break: break-all;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0.75rem 0;
  }
  .status.error { color: var(--neg); }
  .status-row {
    margin: 0.4rem 0 0.8rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.6rem;
    margin: 0.6rem 0;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.7rem 0.85rem;
  }
  .stat .label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.25rem;
  }
  .stat .value {
    font-size: 1.05rem;
    font-weight: 600;
  }
  .stat .value.pos { color: var(--pos); }
  .stat .value.neg { color: var(--neg); }
  .stat .sub {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 0.2rem;
  }
  .section {
    margin-top: 1.4rem;
  }
  /* Recent-messages list — same visual register as the global feed's
     message cards so a visitor jumping between /e/<id> and / sees a
     consistent surface.  Audit r44 #3: until this section landed the
     profile page was counters-only and the Reddit/Twitter framing
     broke at click 3. */
  .messages-list .msg-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.7rem 0.85rem;
    margin: 0.5rem 0;
  }
  .messages-list .msg-card .body {
    font-size: 0.95rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 0 0 0.4rem;
  }
  .messages-list .msg-card .meta {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 0.9rem;
  }
  .messages-list .msg-card .meta a { color: var(--accent); }
  .messages-list .msg-card .community {
    display: inline-block;
    padding: 0.05rem 0.4rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.75rem;
  }
  .messages-list .msg-card .votes.pos { color: var(--pos); }
  .messages-list .msg-card .votes.neg { color: var(--neg); }
  .messages-list .empty {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0.5rem 0;
  }
  .section h2 {
    font-size: 0.95rem;
    margin: 0 0 0.5rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .search {
    margin: 0.6rem 0 0.4rem;
    display: flex;
    gap: 0.5rem;
  }
  .search input {
    flex: 1;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    padding: 0.45rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
  }
  .search button {
    padding: 0.45rem 0.9rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--border);
  }
  footer .row { margin: 0.15rem 0; }
  footer code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><a href="/">MessageChain</a></h1>
  <p class="sub">entity profile</p>
</header>
<main>
  <div class="search">
    <input id="searchBox" type="text" autocomplete="off"
           placeholder="64-char hex entity_id"
           aria-label="Search entity_id">
    <button id="searchBtn" type="button">Open</button>
  </div>
  <div class="id-row" id="idRow"></div>
  <p class="status" id="status">Loading…</p>
  <div id="profile" hidden>
    <p class="status-row" id="statusRow"></p>
    <div class="section">
      <h2>Funds</h2>
      <div class="grid" id="fundsGrid"></div>
    </div>
    <div class="section">
      <h2>Activity</h2>
      <div class="grid" id="postsGrid"></div>
    </div>
    <div class="section">
      <h2>Reputation</h2>
      <div class="grid" id="reputationGrid"></div>
    </div>
    <div class="section">
      <h2>Governance</h2>
      <div class="grid" id="governanceGrid"></div>
    </div>
    <div class="section">
      <h2>Recent messages</h2>
      <div id="messagesList" class="messages-list">
        <p class="status" id="messagesStatus">Loading messages…</p>
      </div>
    </div>
  </div>
</main>
<footer id="chainFooter">
  <div class="row">Read-only snapshot at chain height <span id="chainHeight">…</span></div>
  <div class="row">chain_id <code id="chainId">…</code></div>
  <div class="row">genesis <code id="footerGenesis">…</code></div>
  <div class="row">tip <code id="footerTip">…</code></div>
  <div class="row"><a href="/">Back to live feed</a></div>
</footer>
<script>
(function () {
  "use strict";
  const statusEl = document.getElementById("status");
  const profileEl = document.getElementById("profile");
  const idRow = document.getElementById("idRow");
  const heightEl = document.getElementById("chainHeight");
  const searchBox = document.getElementById("searchBox");
  const searchBtn = document.getElementById("searchBtn");

  function entityIdFromPath() {
    // Expect /e/<64-hex>.  Anything else → empty.
    const m = location.pathname.match(/^\/e\/([0-9a-fA-F]{64})$/);
    return m ? m[1].toLowerCase() : "";
  }

  function fmtTs(sec) {
    if (typeof sec !== "number") return "—";
    const d = new Date(sec * 1000);
    if (isNaN(d.getTime())) return "—";
    return d.toISOString().replace("T", " ").slice(0, 19) + " UTC";
  }

  function fmtInt(n) {
    if (typeof n !== "number") return "—";
    return n.toLocaleString();
  }

  function fmtPct(p) {
    if (typeof p !== "number") return "—";
    return p.toFixed(1) + "%";
  }

  function fmtSmallPct(p) {
    // For "% of total supply spent" — values are typically far below
    // 1%.  Render with enough precision to be readable across 4–5
    // orders of magnitude without dropping to scientific notation
    // on a profile page.
    if (typeof p !== "number") return "—";
    if (p === 0) return "0%";
    if (p >= 1) return p.toFixed(2) + "%";
    if (p >= 0.01) return p.toFixed(4) + "%";
    if (p >= 0.0001) return p.toFixed(6) + "%";
    return p.toExponential(2) + "%";
  }

  function fmtRelativeSince(sec) {
    if (typeof sec !== "number") return "—";
    const now = Date.now() / 1000;
    const delta = Math.max(0, now - sec);
    const day = 86400;
    if (delta < 3600) {
      const m = Math.max(1, Math.round(delta / 60));
      return m + (m === 1 ? " minute ago" : " minutes ago");
    }
    if (delta < day) {
      const h = Math.round(delta / 3600);
      return h + (h === 1 ? " hour ago" : " hours ago");
    }
    if (delta < 30 * day) {
      const d = Math.round(delta / day);
      return d + (d === 1 ? " day ago" : " days ago");
    }
    if (delta < 365 * day) {
      const mo = Math.round(delta / (30 * day));
      return mo + (mo === 1 ? " month ago" : " months ago");
    }
    const yrs = delta / (365 * day);
    return yrs.toFixed(1) + " years ago";
  }

  function clearGrids() {
    for (const id of [
      "fundsGrid", "postsGrid",
      "reputationGrid", "governanceGrid",
    ]) {
      const g = document.getElementById(id);
      if (g) g.replaceChildren();
    }
    const sr = document.getElementById("statusRow");
    if (sr) sr.textContent = "";
  }

  function addStat(gridId, label, value, sub, valueClass) {
    const card = document.createElement("div");
    card.className = "stat";
    const l = document.createElement("div");
    l.className = "label";
    l.textContent = label;
    const v = document.createElement("div");
    v.className = "value" + (valueClass ? " " + valueClass : "");
    v.textContent = value === null || value === undefined ? "—" : String(value);
    card.appendChild(l);
    card.appendChild(v);
    if (sub) {
      const s = document.createElement("div");
      s.className = "sub";
      s.textContent = sub;
      card.appendChild(s);
    }
    document.getElementById(gridId).appendChild(card);
  }

  function signClass(n) {
    if (typeof n !== "number") return "";
    if (n > 0) return "pos";
    if (n < 0) return "neg";
    return "";
  }

  function render(profile, height) {
    clearGrids();
    heightEl.textContent = height;

    // Top-line status: registered + first-seen, in a single sentence.
    const sr = document.getElementById("statusRow");
    const us = profile.user_since;
    if (profile.exists && us) {
      sr.textContent = "Registered since " + fmtTs(us.timestamp) +
        " (block " + us.block_number + ").";
    } else if (profile.exists) {
      sr.textContent = "Registered.";
    } else {
      sr.textContent = "Not seen on-chain.";
    }

    // Funds
    addStat("fundsGrid", "Spendable balance", fmtInt(profile.balance));
    addStat("fundsGrid",
      "Total funds",
      fmtInt(profile.total_funds),
      "balance + staked + pending unstake");
    addStat("fundsGrid",
      "Staked",
      fmtInt(profile.staked),
      typeof profile.stake_pct_of_funds === "number"
        ? fmtPct(profile.stake_pct_of_funds) + " of total funds"
        : null);
    if (profile.pending_unstake > 0) {
      addStat("fundsGrid", "Pending unstake", fmtInt(profile.pending_unstake));
    }
    addStat("fundsGrid",
      "Block rewards",
      fmtInt(profile.rewards.estimated_block_rewards),
      profile.rewards.blocks_proposed + " block(s) proposed");
    addStat("fundsGrid", "Total fees paid", fmtInt(profile.fees_paid));
    addStat("fundsGrid",
      "Supply spent on network",
      fmtSmallPct(profile.supply_spent_pct_cumulative),
      "cumulative — % of total supply at time of each spend");

    // Posts
    const m = profile.messages;
    addStat("postsGrid",
      "First seen",
      us ? fmtRelativeSince(us.timestamp) : "—",
      us ? fmtTs(us.timestamp) + " · block " + us.block_number : null);
    addStat("postsGrid", "Total messages", fmtInt(m.total));
    addStat("postsGrid",
      "First post",
      m.first_post_timestamp ? fmtTs(m.first_post_timestamp) : "—",
      m.first_post_block ? "block " + m.first_post_block : null);
    addStat("postsGrid",
      "Last post",
      m.last_post_timestamp ? fmtTs(m.last_post_timestamp) : "—",
      m.last_post_block ? "block " + m.last_post_block : null);

    // Reputation
    const rep = profile.reputation;
    addStat("reputationGrid",
      "Profile upvotes",
      fmtInt(rep.ups_received),
      typeof rep.rate_pct === "number"
        ? fmtPct(rep.rate_pct) + " up · -" + rep.downs_received + " down"
        : "no votes yet",
      signClass(rep.score));
    const ps = profile.post_score;
    addStat("reputationGrid",
      "Distinct post upvoters",
      fmtInt(ps.distinct_upvoters),
      typeof ps.rate_pct === "number"
        ? fmtPct(ps.rate_pct) + " up · " + ps.ups_received + "/+ "
          + ps.downs_received + "/- across all posts"
        : "no post votes yet",
      signClass(ps.total));
    addStat("reputationGrid", "Reactions cast", fmtInt(profile.reactions_cast));

    // Governance
    addStat("governanceGrid", "Proposals made", fmtInt(profile.governance.proposals_made));
    addStat("governanceGrid", "Votes cast", fmtInt(profile.governance.votes_cast));

    profileEl.hidden = false;
  }

  function renderMessages(messages) {
    const list = document.getElementById("messagesList");
    if (!list) return;
    list.replaceChildren();
    if (!messages || messages.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No messages from this entity yet.";
      list.appendChild(empty);
      return;
    }
    for (const m of messages) {
      const card = document.createElement("div");
      card.className = "msg-card";

      const body = document.createElement("p");
      body.className = "body";
      // textContent for XSS safety — message bodies are arbitrary
      // user bytes.  Mirrors the receipt-page message-card pattern.
      body.textContent = m.message;
      card.appendChild(body);

      const meta = document.createElement("div");
      meta.className = "meta";

      // Permalink to /r/<tx_hash> — the per-message receipt page,
      // i.e. the chain's headline permanence demo URL.
      if (m.tx_hash) {
        const perma = document.createElement("a");
        perma.href = "/r/" + m.tx_hash;
        perma.textContent = "Permanent";
        meta.appendChild(perma);
      }

      if (typeof m.block_number === "number") {
        const blk = document.createElement("span");
        blk.textContent = "block " + m.block_number;
        meta.appendChild(blk);
      }

      if (typeof m.timestamp === "number") {
        const ts = document.createElement("span");
        ts.textContent = fmtRelativeSince(m.timestamp);
        ts.title = fmtTs(m.timestamp);
        meta.appendChild(ts);
      }

      if (m.community_id) {
        const comm = document.createElement("span");
        comm.className = "community";
        comm.textContent = "/" + m.community_id;
        meta.appendChild(comm);
      }

      // Vote summary if present.
      if (
        typeof m.ups === "number" && typeof m.downs === "number"
        && (m.ups + m.downs) > 0
      ) {
        const v = document.createElement("span");
        const net = m.ups - m.downs;
        v.className = "votes " + signClass(net);
        v.textContent =
          "▲ " + m.ups + " · ▼ " + m.downs
          + (typeof m.up_pct === "number"
              ? " · " + fmtPct(m.up_pct) + " up" : "");
        meta.appendChild(v);
      }

      // Optional reply-thread pointer.
      if (m.prev) {
        const prevA = document.createElement("a");
        prevA.href = "/r/" + m.prev;
        prevA.textContent = "↳ reply to";
        meta.appendChild(prevA);
      }

      card.appendChild(meta);
      list.appendChild(card);
    }
  }

  async function loadMessages(id) {
    const list = document.getElementById("messagesList");
    if (!list) return;
    const statusMsg = document.getElementById("messagesStatus");
    try {
      const r = await fetch(
        "/v1/entity_messages?id=" + encodeURIComponent(id) + "&limit=20",
        { cache: "no-store" },
      );
      const data = await r.json();
      if (!r.ok || !data.ok) {
        if (statusMsg) {
          statusMsg.className = "status error";
          statusMsg.textContent =
            "Messages lookup failed: "
            + (data.error || ("HTTP " + r.status));
        }
        return;
      }
      renderMessages(data.messages || []);
    } catch (e) {
      if (statusMsg) {
        statusMsg.className = "status error";
        statusMsg.textContent = "Messages network error: " + e.message;
      }
    }
  }

  async function load(id) {
    statusEl.className = "status";
    statusEl.textContent = "Loading…";
    profileEl.hidden = true;
    idRow.textContent = id;
    try {
      const r = await fetch("/v1/entity?id=" + encodeURIComponent(id),
                            { cache: "no-store" });
      const data = await r.json();
      if (!r.ok || !data.ok) {
        statusEl.className = "status error";
        statusEl.textContent = "Lookup failed: " + (data.error || ("HTTP " + r.status));
        return;
      }
      statusEl.textContent = "";
      render(data.profile, data.height);
      // Fan out the recent-messages fetch in parallel — the
      // profile-counters and the messages list are independent,
      // and a slow chain scan for the messages should not block
      // the counters from rendering.
      loadMessages(id);
    } catch (e) {
      statusEl.className = "status error";
      statusEl.textContent = "Network error: " + e.message;
    }
  }

  function gotoSearch() {
    const v = (searchBox.value || "").trim().toLowerCase();
    if (!/^[0-9a-f]{64}$/.test(v)) {
      statusEl.className = "status error";
      statusEl.textContent = "Address must be exactly 64 hex characters.";
      return;
    }
    location.href = "/e/" + v;
  }
  searchBtn.addEventListener("click", gotoSearch);
  searchBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter") gotoSearch();
  });

  // Chain-identity footer.  Populated from /v1/info so a paranoid
  // visitor on a hostile network can sanity-check the rendered
  // genesis/tip hashes against the README's pinned values without
  // leaving the page.  Best-effort: a /v1/info miss leaves the
  // placeholders visible but does not block the profile render.
  function shortHex(hex, head, tail) {
    if (!hex) return "";
    if (hex.length <= head + tail + 1) return hex;
    return hex.slice(0, head) + "…" + hex.slice(-tail);
  }
  async function loadChainIdentityFooter() {
    try {
      const r = await fetch("/v1/info", { cache: "no-store" });
      const data = await r.json();
      if (!data || !data.ok) return;
      const setText = (id, txt) => {
        const el = document.getElementById(id);
        if (el) el.textContent = txt;
      };
      setText("chainId", data.chain_id || "—");
      setText("footerGenesis",
              data.genesis_hash ? shortHex(data.genesis_hash, 12, 10) : "(loading)");
      setText("footerTip",
              data.tip_hash ? shortHex(data.tip_hash, 12, 10) : "(loading)");
      const fg = document.getElementById("footerGenesis");
      const ft = document.getElementById("footerTip");
      if (fg && data.genesis_hash) fg.title = data.genesis_hash;
      if (ft && data.tip_hash) ft.title = data.tip_hash;
    } catch (_) { /* footer is best-effort */ }
  }
  loadChainIdentityFooter();

  const id = entityIdFromPath();
  if (!id) {
    statusEl.className = "status error";
    statusEl.textContent = "URL must be /e/<64-char hex entity_id>";
    return;
  }
  searchBox.value = id;
  load(id);
})();
</script>
</body>
</html>
